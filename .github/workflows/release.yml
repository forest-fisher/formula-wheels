name: Publish approved GitHub release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the declared approved release source
        run: |
          python - <<'PY_RELEASE'
          import json, os
          meta = json.load(open('PUBLIC_VERSION.json'))
          allowed = ('refs/heads/main', 'refs/tags/' + meta['tag'])
          if os.environ['GITHUB_REF'] not in allowed:
              raise SystemExit('Release must run on main or the approved version tag')
          PY_RELEASE
      - name: Verify and stage the approved artifact
        run: |
          python tools/package_public_release.py
          cd dist && sha256sum --check SHA256SUMS.txt
      - name: Create tag if manually dispatched; publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python -c 'import json; print(json.load(open("PUBLIC_VERSION.json"))["tag"])')"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag already exists; refusing to overwrite it"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "First public release: approved internal Formula Wheels 22.0"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            dist/formula-wheels-v1.0.0.zip \
            dist/SHA256SUMS.txt \
            dist/PUBLIC_VERSION.json \
            --verify-tag \
            --title "Formula Wheels 1.0.0" \
            --notes-file docs/PUBLIC_RELEASE_NOTES_v1_0_0.md \
            --latest
